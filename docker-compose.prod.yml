# Produção: API (network_mode: host) + Evolution API embutida (Redis/Postgres dedicados).
#
# Uso: docker compose -f docker-compose.prod.yml up -d --build
#
# backend/.env (mínimo Evolution):
#   EVOLUTION_INTERNAL_BASE_URL=http://127.0.0.1:8080
#   EVOLUTION_GLOBAL_API_KEY=<32+ chars, igual AUTHENTICATION_API_KEY da Evolution>
#   DX_CONNECT_WEBHOOK_BASE_URL=https://api.seudominio.com   # URL pública da API (webhook)
#   EVOLUTION_POSTGRES_PASSWORD=<senha forte>
# Opcional: EVOLUTION_SERVER_URL (padrão http://127.0.0.1:8080)
#
# Antes do primeiro up (ou após nova migration):
#   docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head

services:
  evolution-redis:
    image: redis:7-alpine
    container_name: dx-connect-evolution-redis
    networks:
      - evolution
    restart: unless-stopped

  evolution-db:
    image: postgres:16-alpine
    container_name: dx-connect-evolution-db
    networks:
      - evolution
    environment:
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:-evolution_change_me}
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-evolution}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_POSTGRES_USER:-evolution} -d ${EVOLUTION_POSTGRES_DB:-evolution}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: dx-connect-evolution-api
    networks:
      - evolution
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://127.0.0.1:8080}
      SERVER_PORT: "8080"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:-}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD}@evolution-db:5432/${EVOLUTION_POSTGRES_DB:-evolution}?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evo_dx
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_CLIENT: DX Connect
    volumes:
      - evolution_instances:/evolution/instances
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DX_CONNECT_GIT_SHA: ${DX_CONNECT_GIT_SHA:-unknown}
    container_name: dx-connect-api
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      GUNICORN_BIND: "127.0.0.1:8000"
      DX_CONNECT_GIT_SHA: ${DX_CONNECT_GIT_SHA:-unknown}
    network_mode: host
    depends_on:
      evolution-api:
        condition: service_started
    restart: unless-stopped

networks:
  evolution:
    driver: bridge

volumes:
  evolution_postgres_data:
  evolution_instances:
