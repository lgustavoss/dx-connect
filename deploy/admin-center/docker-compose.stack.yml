# Stack Docker do painel admin DeskRudder (Postgres + API).
# Gerado em deploy/admin-center/docker-compose.yml (não vai no git).
#
# Build context: dois níveis até a raiz (não o mesmo path de deploy/clients/<slug>/).
# Postgres com TLS local (self-signed) — Settings exige sslmode=require em production.

services:
  db:
    image: postgres:16-alpine
    container_name: dx-connect-db-${CLIENT_SLUG}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      [
        "postgres",
        "-c",
        "ssl=on",
        "-c",
        "ssl_cert_file=/etc/postgresql/server.crt",
        "-c",
        "ssl_key_file=/etc/postgresql/server.key",
      ]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./certs/server.crt:/etc/postgresql/server.crt:ro
      - ./certs/server.key:/etc/postgresql/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        DX_CONNECT_GIT_SHA: ${DX_CONNECT_GIT_SHA:-unknown}
    container_name: dx-connect-api-${CLIENT_SLUG}
    env_file:
      - client.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=require
    ports:
      - "127.0.0.1:${CLIENT_API_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

volumes:
  db_data:
    name: dx-connect-pgdata-${CLIENT_SLUG}
  backend_data:
    name: dx-connect-data-${CLIENT_SLUG}
