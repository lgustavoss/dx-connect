services:
  evolution-redis:
    image: redis:7-alpine
    container_name: dx-connect-evolution-redis
    restart: unless-stopped

  evolution-db:
    image: postgres:16-alpine
    container_name: dx-connect-evolution-db
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_e2e_secret
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: dx-connect-evolution-api
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      SERVER_PORT: "8080"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: dev_dxconnect_evolution_global_32chars_min
      # Permite ler apikey por instância no fetchInstances (útil se o create não devolver hash).
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution_e2e_secret@evolution-db:5432/evolution?schema=public
      DATABASE_ENABLED: "true"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evo_dx
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_CLIENT: DX Connect
    volumes:
      - evolution_instances:/evolution/instances
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: dx-connect-db
    environment:
      POSTGRES_USER: dxconnect
      POSTGRES_PASSWORD: dxconnect_secret
      POSTGRES_DB: dxconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dxconnect -d dxconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "1"
    container_name: dx-connect-api
    env_file:
      - ./backend/.env
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      evolution-api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://dxconnect:dxconnect_secret@db:5432/dxconnect
      ENVIRONMENT: development
      EVOLUTION_INTERNAL_BASE_URL: http://evolution-api:8080
      EVOLUTION_GLOBAL_API_KEY: dev_dxconnect_evolution_global_32chars_min
      DX_CONNECT_WEBHOOK_BASE_URL: http://backend:8000
    volumes:
      # Código + tests + pytest.ini do host (evita rebuild só por alteração em tests/).
      - ./backend:/app

volumes:
  postgres_data:
  evolution_postgres_data:
  evolution_instances:
