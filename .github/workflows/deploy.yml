# Deploy: dois builds frontend + rsync + git pull + Alembic + Docker Compose (#880).
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST                  - hostname ou IP do VPS
#   DEPLOY_USER                  - usuario SSH
#   DEPLOY_SSH_KEY               - chave privada OpenSSH completa
#   DEPLOY_PATH                  - clone do repositorio no servidor
#   DEPLOY_FRONTEND_DIST         - dist do painel DuplexSoft (Nginx duplexsoft.*)
#   DEPLOY_FRONTEND_DIST_ADMIN   - dist landing/SaaS (ex.: /var/www/dx-connect/admin-center/dist)
#   VITE_API_URL                 - HTTPS API DuplexSoft (sem barra final)
#   VITE_API_URL_ADMIN           - HTTPS API comercial api.deskrudder.com.br
# Opcional:
#   DEPLOY_SSH_PORT              - porta SSH (padrao 22)
#   DEPLOY_GIT_REF               - branch no VPS (padrao staging)
#
# Ver deploy/github-actions.md (#734 / #880).

name: Deploy

on:
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Nao executar alembic upgrade (so em situacoes excepcionais)"
        required: false
        default: false
        type: boolean
  push:
    branches: [staging]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.prod.yml"
      - "deploy/admin-center/**"
      - ".github/workflows/deploy.yml"
      - "deploy/scripts/**"
      - "VERSION"
      - "CHANGELOG.md"
      - "scripts/**"
      - "docs/releases/**"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
  DEPLOY_FRONTEND_DIST: ${{ secrets.DEPLOY_FRONTEND_DIST }}
  DEPLOY_FRONTEND_DIST_ADMIN: ${{ secrets.DEPLOY_FRONTEND_DIST_ADMIN }}
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_API_URL_ADMIN: ${{ secrets.VITE_API_URL_ADMIN }}
  SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
  DEPLOY_GIT_REF: ${{ secrets.DEPLOY_GIT_REF }}
  EVENT_REF: ${{ github.ref_name }}
  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
  SKIP_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_migrations == true || false }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]'))
    permissions:
      contents: read
    outputs:
      expected_sha: ${{ steps.sha.outputs.sha }}
      dx_version: ${{ steps.release.outputs.dx_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolver SHA esperado no ref deployado
        id: sha
        run: |
          REF="${EVENT_REF:-${DEPLOY_GIT_REF:-staging}}"
          git fetch origin "${REF}"
          SHA="$(git rev-parse --short "origin/${REF}")"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "SHA esperado em producao (origin/${REF}): ${SHA}"

      - name: Preparar release (CalVer + release notes)
        id: release
        run: |
          python3 scripts/prepare_release.py --deploy --write-env >> "$GITHUB_ENV"
          echo "dx_version=$(tr -d '\n\r' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Validar secrets de build/deploy
        run: |
          if [ -z "${VITE_API_URL:-}" ]; then
            echo "::error::Defina VITE_API_URL (API DuplexSoft HTTPS, sem barra no final)."
            exit 1
          fi
          if [ -z "${VITE_API_URL_ADMIN:-}" ]; then
            echo "::error::Defina VITE_API_URL_ADMIN (API comercial https://api.deskrudder.com.br)."
            exit 1
          fi
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_USER:-}" ] || [ -z "${DEPLOY_PATH:-}" ]; then
            echo "::error::Defina DEPLOY_HOST, DEPLOY_USER e DEPLOY_PATH."
            exit 1
          fi
          if [ -z "${DEPLOY_FRONTEND_DIST:-}" ] || [ -z "${DEPLOY_FRONTEND_DIST_ADMIN:-}" ]; then
            echo "::error::Defina DEPLOY_FRONTEND_DIST (DuplexSoft) e DEPLOY_FRONTEND_DIST_ADMIN (landing/SaaS)."
            exit 1
          fi
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::Defina DEPLOY_SSH_KEY."
            exit 1
          fi
          case "${VITE_API_URL}" in
            *api.deskrudder.com.br*)
              echo "::error::VITE_API_URL não pode ser a API comercial — use VITE_API_URL_ADMIN para isso."
              exit 1
              ;;
          esac
          case "${VITE_API_URL_ADMIN}" in
            *api-duplexsoft*)
              echo "::error::VITE_API_URL_ADMIN não pode ser a API DuplexSoft."
              exit 1
              ;;
          esac

      - name: Build frontend DuplexSoft
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.DX_CONNECT_VERSION }}
          VITE_APP_VERSION_DISPLAY: ${{ env.VITE_APP_VERSION_DISPLAY }}
          VITE_API_URL: ${{ env.VITE_API_URL }}
        run: |
          npm ci
          # Sem VITE_SAAS_CONTROL_PLANE — painel do cliente
          npx vite build --outDir dist-duplexsoft --emptyOutDir

      - name: Build frontend admin-center (landing /saas)
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.DX_CONNECT_VERSION }}
          VITE_APP_VERSION_DISPLAY: ${{ env.VITE_APP_VERSION_DISPLAY }}
          VITE_API_URL: ${{ env.VITE_API_URL_ADMIN }}
          VITE_SAAS_CONTROL_PLANE: "true"
          VITE_MARKETING_SITE_URL: https://deskrudder.com.br
          VITE_CLIENT_APP_HOST: deskrudder.com.br
          VITE_DEFAULT_TENANT_ID: "1"
        run: |
          npx vite build --outDir dist-admin-center --emptyOutDir

      - name: Empacotar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: deploy-dist
          path: |
            frontend/dist-duplexsoft/
            frontend/dist-admin-center/
            VERSION
            CHANGELOG.md
            docs/releases/manifest.json
            backend/app/data/release_notes.json
            frontend/public/release-notes.json
          retention-days: 2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ssh_timeout: ${{ steps.classify.outputs.ssh_timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Descarregar artefactos
        uses: actions/download-artifact@v4
        with:
          name: deploy-dist

      - name: Deploy no VPS (IPv4)
        id: vps
        env:
          EXPECTED_DEPLOY_SHA: ${{ needs.build.outputs.expected_sha }}
          DX_CONNECT_VERSION: ${{ needs.build.outputs.dx_version }}
        run: |
          chmod +x deploy/scripts/gha-deploy-vps.sh
          set +e
          bash deploy/scripts/gha-deploy-vps.sh
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Classificar falha SSH
        id: classify
        run: |
          code="${{ steps.vps.outputs.code }}"
          if [ "$code" = "0" ]; then
            echo "ssh_timeout=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" = "42" ]; then
            echo "ssh_timeout=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Timeout SSH neste runner — job deploy-retry noutro IP."
            exit 0
          fi
          echo "ssh_timeout=false" >> "$GITHUB_OUTPUT"
          echo "::error::Deploy falhou (exit ${code}); não é timeout SSH — sem retry noutro runner."
          exit 1

      - name: Persistir manifest e CHANGELOG em staging
        if: github.ref == 'refs/heads/staging' && steps.vps.outputs.code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md docs/releases/manifest.json \
            backend/app/data/release_notes.json frontend/public/release-notes.json
          if git diff --staged --quiet; then
            echo "Nenhum artefato de release para commitar."
            exit 0
          fi
          VER="$(tr -d '\n\r' < VERSION)"
          git commit -m "chore(release): publica v${VER} [skip ci]"
          git push origin HEAD:staging

  deploy-retry:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && needs.deploy.result == 'success' && needs.deploy.outputs.ssh_timeout == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Descarregar artefactos (sem rebuild)
        uses: actions/download-artifact@v4
        with:
          name: deploy-dist

      - name: Retry deploy noutro runner (IPv4)
        env:
          EXPECTED_DEPLOY_SHA: ${{ needs.build.outputs.expected_sha }}
          DX_CONNECT_VERSION: ${{ needs.build.outputs.dx_version }}
        run: |
          chmod +x deploy/scripts/gha-deploy-vps.sh
          bash deploy/scripts/gha-deploy-vps.sh

      - name: Persistir manifest e CHANGELOG em staging
        if: github.ref == 'refs/heads/staging'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md docs/releases/manifest.json \
            backend/app/data/release_notes.json frontend/public/release-notes.json
          if git diff --staged --quiet; then
            echo "Nenhum artefato de release para commitar."
            exit 0
          fi
          VER="$(tr -d '\n\r' < VERSION)"
          git commit -m "chore(release): publica v${VER} [skip ci]"
          git push origin HEAD:staging
