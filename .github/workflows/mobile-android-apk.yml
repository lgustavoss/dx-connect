# APK de teste do app DeskRudder (Expo/React Native) para instalar no celular
# sem Play Store e sem conta Expo — build feito no mesmo padrão dos apps desktop.
#
# Actions → «DeskRudder Mobile Android» → Run workflow
# Resultado: artifact DeskRudder-Mobile-android e, se marcar a opção,
# Release mobile-android com DeskRudder-Mobile.apk + version.json.
# Duração típica: 10–20 min no primeiro build (Gradle baixa as dependências).

name: DeskRudder Mobile Android

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar Release mobile-android (APK estável)"
        required: true
        default: true
        type: boolean

concurrency:
  group: app-mobile-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: APK debug (Expo prebuild + Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Conferir google-services.json
        run: test -f google-services.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK debug
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true

      - name: Resolver artefato
        id: art
        run: |
          set -euo pipefail
          VER="$(node -p "require('./app.json').expo.version")"
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${SRC}" >> "$GITHUB_OUTPUT"
          ls -lh "$SRC"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskRudder-Mobile-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release mobile-android
        if: ${{ inputs.publish_release }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.art.outputs.version }}"
          SRC="mobile/${{ steps.art.outputs.apk_path }}"
          STABLE_DIR="dist-mobile"
          mkdir -p "$STABLE_DIR"
          STABLE="$STABLE_DIR/DeskRudder-Mobile.apk"
          cp -f "$SRC" "$STABLE"
          TAG="mobile-android"
          TITLE="DeskRudder Mobile ${VER} (Android)"
          NOTES="APK **${VER}** de teste (debug, fora da Play Store). Login pelo slug da instância; push FCM exige o backend com \`/v1/dispositivos\` publicado."
          VERSION_JSON="$STABLE_DIR/version.json"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/DeskRudder-Mobile.apk"
          node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({ version: process.argv[2], download_url: process.argv[3] }, null, 2) + '\n')" \
            "$VERSION_JSON" "$VER" "$DOWNLOAD_URL"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$STABLE" "$VERSION_JSON" \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            gh release create "$TAG" "$STABLE" "$VERSION_JSON" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest=false
          fi
          echo "Publicado: $DOWNLOAD_URL"
