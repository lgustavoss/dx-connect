# Setup do ATENDENTE: painel DeskRudder + Acesso Remoto embutido.
# Rápido: só monta o Electron e baixa o remoto já publicado.
#
# Pré-requisito (1.ª vez ou ao atualizar o remoto):
#   Actions → «Acesso Remoto Atendente (Windows)»
#
# Actions → «App Atendente Setup (Windows)» → Run workflow
# Resultado: Release desktop-windows / DeskRudder-Setup.exe (link /app/download)
# Duração típica: poucos minutos.

name: App Atendente Setup (Windows)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar Release desktop-windows (/app/download)"
        required: true
        default: true
        type: boolean

concurrency:
  group: app-atendente-setup-windows
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  setup:
    name: Setup painel + remoto
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Baixar remoto atendente (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEST="desktop/vendor/remoto-controle"
          mkdir -p "$DEST"
          ASSET="DeskRudder-AcessoRemoto-Controle.exe"
          if ! gh release download acesso-remoto-controle-windows \
            --repo "${{ github.repository }}" \
            --pattern "$ASSET" \
            --dir "$DEST" \
            --clobber; then
            echo "::error::Falta o Release acesso-remoto-controle-windows. Rode antes o workflow «Acesso Remoto Atendente (Windows)» (só quando o remoto mudar). Depois rode de novo este Setup."
            exit 1
          fi
          ls -lh "$DEST/$ASSET"

      - name: Instalar dependências Electron
        working-directory: desktop
        run: npm ci

      - name: Testes da sessão DeskRemote
        working-directory: desktop
        run: npm test

      - name: Gerar Setup (electron-builder NSIS)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # Publicação do Release é o passo «Publicar Release» (gh), não o publish do electron-builder.
        run: npm run dist

      - name: Resolver artefato
        id: art
        working-directory: desktop
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          SRC="release/DeskRudder-Setup-${VER}.exe"
          test -f "$SRC"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "setup_path=${SRC}" >> "$GITHUB_OUTPUT"
          ls -lh "$SRC"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskRudder-Setup-windows
          path: desktop/release/DeskRudder-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release desktop-windows
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.art.outputs.version }}"
          SRC="desktop/${{ steps.art.outputs.setup_path }}"
          STABLE_DIR="dist-desktop"
          mkdir -p "$STABLE_DIR"
          STABLE="$STABLE_DIR/DeskRudder-Setup.exe"
          cp -f "$SRC" "$STABLE"
          TAG="desktop-windows"
          TITLE="DeskRudder App Atendente ${VER} (Windows)"
          NOTES="Setup **${VER}** do atendente (painel + Acesso Remoto). Link amigável: \`/app/download\`. Remoto embutido vem do Release acesso-remoto-controle-windows."
          VERSION_JSON="$STABLE_DIR/version.json"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/DeskRudder-Setup.exe"
          node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({ version: process.argv[2], download_url: process.argv[3] }, null, 2) + '\n')" \
            "$VERSION_JSON" "$VER" "$DOWNLOAD_URL"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$STABLE" "$VERSION_JSON" \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            gh release create "$TAG" "$STABLE" "$VERSION_JSON" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest=false
          fi
          echo "Publicado: https://github.com/${{ github.repository }}/releases/download/${TAG}/DeskRudder-Setup.exe"
