# CI: lint básico, auditoria de dependências e build do frontend.
# Não substitui revisão humana nem SAST completo; complementa Dependabot.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar CHANGELOG [Unreleased]
        run: |
          python scripts/check_changelog.py \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências do sistema (psycopg2)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev gcc

      - name: Instalar requirements e pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pip-audit

      - name: Auditoria de vulnerabilidades (PyPI)
        run: pip-audit -r requirements.txt

      - name: Pytest
        run: pytest -q

      - name: Verificar sintaxe Python
        run: python -m compileall -q app

      - name: Verificar única head do Alembic
        run: |
          heads=$(alembic heads | grep -c '(head)' || true)
          if [ "$heads" -ne 1 ]; then
            echo "Esperada 1 head do Alembic, encontradas: $heads"
            alembic heads
            exit 1
          fi

      - name: Verificar tamanho dos revision IDs (máx. 32)
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for path in pathlib.Path("alembic/versions").glob("*.py"):
              text = path.read_text(encoding="utf-8")
              m = re.search(r'^revision\s*=\s*["\']([^"\']+)["\']', text, re.M)
              if m and len(m.group(1)) > 32:
                  bad.append(f"{path.name}: {m.group(1)!r} ({len(m.group(1))} chars)")
          if bad:
              print("revision IDs excedem varchar(32) do alembic_version:", file=sys.stderr)
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Build de produção
        env:
          VITE_API_URL: https://ci.invalid.example
        run: npm run build
