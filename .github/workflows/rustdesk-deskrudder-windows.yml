# DeskRemote Cliente v1 (Sciter) — CONGELADO em 1.0.14.
# Canal de produção é o Flutter 2.x («DeskRemote Cliente v2»).
# Só rode para hotfix 32-bit, com confirmar=gerar-sciter.
#
# Actions → «DeskRemote Cliente v1» → Run workflow
# Resultado: Release acesso-remoto-windows / DeskRudder-AcessoRemoto.exe

name: DeskRemote Cliente v1

on:
  workflow_dispatch:
    inputs:
      rustdesk_ref:
        description: "Tag do rustdesk/rustdesk (tem de existir no GitHub)"
        required: true
        default: "1.5.0"
        type: choice
        options:
          - "1.5.0"
          - "1.4.9"
      confirmar:
        description: "Sciter 1.0.14 está congelado. Para hotfix 32-bit, digite gerar-sciter"
        required: true
        type: string
        default: ""

concurrency:
  group: acesso-remoto-cliente-windows
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  guard:
    name: Sciter congelado
    runs-on: ubuntu-latest
    steps:
      - name: Recusar build v1
        if: ${{ inputs.confirmar != 'gerar-sciter' }}
        run: |
          echo "::error::Sciter 1.0.14 está congelado. O canal de produção é o Flutter 2.x. Para hotfix 32-bit, rode de novo com confirmar=gerar-sciter."
          exit 1
  build:
    name: Instalador cliente (posto)
    needs: guard
    uses: ./.github/workflows/rustdesk-windows-reusable.yml
    with:
      profile: posto
      rustdesk_ref: ${{ inputs.rustdesk_ref }}
      publish_release: true
