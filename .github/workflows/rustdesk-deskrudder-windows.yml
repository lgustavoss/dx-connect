# Instalador do Acesso Remoto para o PC do CLIENTE (posto/PDV) — só recebe conexão.
#
# Actions → «Acesso Remoto Cliente (Windows)» → Run workflow
# Resultado: Release acesso-remoto-windows / DeskRudder-AcessoRemoto.exe
# Branding: mesma pasta deploy/rustdesk-client/branding/ que o workflow do atendente.
# Após mudar a arte: subir CLIENT_VERSION e rodar Cliente + Atendente.
# Duração típica: 40–90 min (1.ª vez).

name: Acesso Remoto Cliente (Windows)

on:
  workflow_dispatch:
    inputs:
      rustdesk_ref:
        description: "Tag do rustdesk/rustdesk (tem de existir no GitHub)"
        required: true
        default: "1.5.0"
        type: choice
        options:
          - "1.5.0"
          - "1.4.9"

concurrency:
  group: acesso-remoto-cliente-windows
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Instalador cliente (posto)
    uses: ./.github/workflows/rustdesk-windows-reusable.yml
    with:
      profile: posto
      rustdesk_ref: ${{ inputs.rustdesk_ref }}
      publish_release: true
